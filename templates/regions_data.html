    const REGION_DATA = { pakistan_provinces: {}, otherCountries: [] };
    let _parsingCountries = false;

    RAW_REGIONS_TEXT.split('\n').forEach(line => {
        line = line.trim();
        if (!line) return;

        if (line.toLowerCase().includes("countries:")) {
            _parsingCountries = true;
            return;
        }

        if (!_parsingCountries) {
            if (line.includes("—") || line.includes("-")) {
                let parts = line.split(/[—\-]/);
                if (parts.length >= 2) {
                    let city = parts[0].trim();
                    let prov = parts[1].trim();
                    if (city.toLowerCase() === 'city') return;

                    if (!REGION_DATA.pakistan_provinces[prov]) {
                        REGION_DATA.pakistan_provinces[prov] = [];
                    }
                    REGION_DATA.pakistan_provinces[prov].push(city);
                }
            }
        } else {
            if (line.startsWith("-")) {
                let c = line.substring(1).trim();
                if (c.toLowerCase() !== 'pakistan') REGION_DATA.otherCountries.push(c);
            } else if (line.length > 2 && !line.toLowerCase().includes("all country")) {
                let c = line.trim();
                if (c.toLowerCase() !== 'pakistan') REGION_DATA.otherCountries.push(c);
            }
        }
    });

    // Remove duplicates and sort
    REGION_DATA.otherCountries = [...new Set(REGION_DATA.otherCountries)].sort();
    for (let prov in REGION_DATA.pakistan_provinces) {
        REGION_DATA.pakistan_provinces[prov] = [...new Set(REGION_DATA.pakistan_provinces[prov])].sort();
    }

    function renderLocationDropdowns(prefix) {
        let countrySel = document.getElementById(prefix + 'Country');
        let provSel = document.getElementById(prefix + 'Province');
        let citySel = document.getElementById(prefix + 'City');

        if (!countrySel || !provSel || !citySel) return;

        // Clear
        countrySel.innerHTML = '<option value="" disabled selected>Select Country</option>';
        provSel.innerHTML = '<option value="" disabled selected>Select Province</option>';
        citySel.innerHTML = '<option value="" disabled selected>Select City</option>';

        // Populate Countries
        countrySel.insertAdjacentHTML('beforeend', '<option value="Pakistan" class="font-bold text-green-600">Pakistan</option>');

        REGION_DATA.otherCountries.forEach(c => {
            countrySel.insertAdjacentHTML('beforeend', '<option value="' + c + '" disabled class="text-gray-400">' + c + ' (Not Available)</option>');
        });

        // Country Logic
        countrySel.addEventListener('change', function () {
            if (this.value === 'Pakistan') {
                provSel.disabled = false;
                provSel.innerHTML = '<option value="" disabled selected>Select Province</option>';
                citySel.innerHTML = '<option value="" disabled selected>Select City</option>';
                citySel.disabled = true;

                Object.keys(REGION_DATA.pakistan_provinces).sort().forEach(p => {
                    provSel.insertAdjacentHTML('beforeend', '<option value="' + p + '">' + p + '</option>');
                });
            } else {
                provSel.disabled = true;
                citySel.disabled = true;
            }
        });

        // Province Logic
        provSel.addEventListener('change', function () {
            citySel.disabled = false;
            citySel.innerHTML = '<option value="" disabled selected>Select City</option>';
            if (REGION_DATA.pakistan_provinces[this.value]) {
                REGION_DATA.pakistan_provinces[this.value].forEach(c => {
                    citySel.insertAdjacentHTML('beforeend', '<option value="' + c + '">' + c + '</option>');
                });
            }
        });

        // Trigger reset initially
        countrySel.value = "";
        provSel.disabled = true;
        citySel.disabled = true;
    }

    // Auto Initialize matching standard prefixes if present
    document.addEventListener("DOMContentLoaded", () => {
        ['wh_', 'rt_'].forEach(p => renderLocationDropdowns(p));
    });
