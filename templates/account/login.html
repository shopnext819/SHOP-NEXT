{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SHOP NEXT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: #ffc107;
            padding: 45px 35px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 6px;
            color: #000;
        }

        .subtitle {
            font-size: 14px;
            color: #000;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #000;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            opacity: 0.85;
        }

        .google-btn {
            width: 100%;
            background: #fff;
            color: #000;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .google-btn:hover {
            background: #f1f1f1;
        }

        .create-text {
            margin-top: 18px;
            font-size: 14px;
            color: #000;
        }

        .create-text a {
            color: #000;
            font-weight: 600;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>SHOP NEXT</h1>
        <div class="subtitle">LOGIN TO SHOPPING</div>

        <!-- GOOGLE LOGIN -->
        <a href="{% provider_login_url 'google' %}" class="google-btn">
            <i class="fab fa-google"></i>
            Sign in with Google
        </a>

        <!-- EMAIL LOGIN -->
        <form method="POST" action="{% url 'account_login' %}">
            {% csrf_token %}
            <input type="email" name="login" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Next</button>
        </form>

    </div>

</body>

</html>
