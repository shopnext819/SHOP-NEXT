{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container" style="margin-top:40px;">
    <div class="cart-container" style="display:flex; gap:30px;">
        <!-- LEFT SIDE -->
        <div class="cart-left" style="flex:2;">
            {% for item in cart %}
            <div class="cart-item" style="margin-bottom:20px; padding:15px; border:1px solid #ddd; border-radius:8px;">
                <div style="display:flex; align-items:center; gap:20px;">
                    <!-- SELECT CHECKBOX -->
                    <input type="checkbox" 
                           class="select-item" 
                           onchange="updateTotal()" 
                           style="margin-right:15px; width:18px; height:18px;">

                    <!-- IMAGE -->
                    <img src="/static/{{ item.image }}" 
                         width="150" 
                         height="150" 
                         style="border-radius:8px; object-fit:cover;">

                    <!-- INFO -->
                    <div class="cart-info">
                        <h4 class="item-name">{{ item.name }}</h4>
                        <div class="price">$ {{ item.price }}</div>

                        <!-- ✅ UPDATED QTY BOX (ONLY BUTTONS CHANGED) -->
                        <div class="qty-box">
                            <button type="button" class="qty-btn" onclick="changeQty(this,-1)">-</button>
                            <span class="qty">1</span>
                            <button type="button" class="qty-btn" onclick="changeQty(this,1)">+</button>
                        </div>

                    </div>
                </div>

                <!-- REMOVE BUTTON -->
                <div style="margin-top:10px;">
                    <a href="{% url 'remove_from_cart' forloop.counter0 %}">
                        Remove
                    </a>
                </div>
            </div>
            {% empty %}
                <h4>Your cart is empty</h4>
            {% endfor %}
        </div>

        <!-- RIGHT SIDE -->
        <div class="cart-right" style="flex:1; padding:20px; border:1px solid #ddd; border-radius:8px;">
            <h3>Order Summary</h3>
            <div id="selected-items" style="margin-bottom:15px;"></div>
            <hr>
            <div style="display:flex; justify-content:space-between;">
                <span>Subtotal</span>
                <span id="subtotal">$0</span>
            </div>
            <div style="display:flex; justify-content:space-between;">
                <span>Shipping</span>
                <span>$0</span>
            </div>
            <div style="display:flex; justify-content:space-between; font-weight:bold; margin-top:10px;">
                <span>Total</span>
                <span id="total">$0</span>
            </div>
            <button style="margin-top:15px; width:100%;">
                Proceed to Checkout
            </button>
        </div>
    </div>
</div>

<!-- ✅ BUTTON SIZE CONTROL CSS (YOU CAN CHANGE SIZE HERE) -->
<style>
.qty-btn{
    width: 40px;        /* size yahan se control karo */
    height: 40px;
    font-size: 18px;
    border: none;
    background: #fca311;   /* 👈 yellow */
    color: white;          /* 👈 plus minus white */
    cursor: pointer;
    border-radius: 6px;
    font-weight: bold;
}

.qty-btn:hover{
    background: #fca311;   /* thoda dark yellow hover pe */
}
</style>

<script>
function changeQty(btn, value){
    let qtyElement = btn.parentElement.querySelector(".qty");
    let currentQty = parseInt(qtyElement.innerText);
    currentQty += value;
    if(currentQty < 1) currentQty = 1;
    qtyElement.innerText = currentQty;
    updateTotal();
}

function updateTotal(){
    let items = document.querySelectorAll(".cart-item");
    let subtotal = 0;
    let selectedContainer = document.getElementById("selected-items");
    selectedContainer.innerHTML = "";

    items.forEach(item => {
        let checkbox = item.querySelector(".select-item");
        if(checkbox.checked){
            let name = item.querySelector(".item-name").innerText;
            let priceText = item.querySelector(".price").innerText;
            let price = parseFloat(priceText.replace("$",""));
            let qty = parseInt(item.querySelector(".qty").innerText);
            let imgSrc = item.querySelector("img").src;
            let totalPrice = price * qty;
            subtotal += totalPrice;

            selectedContainer.innerHTML += `
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
                    <img src="${imgSrc}" width="100" height="150" style="border-radius:6px;">
                    <div>
                        <div style="font-size:14px;">${name}</div>
                        <div style="font-size:13px; color:gray;">
                            $${price} × ${qty} = $${totalPrice}
                        </div>
                    </div>
                </div>
            `;
        }
    });

    document.getElementById("subtotal").innerText = "$" + subtotal;
    document.getElementById("total").innerText = "$" + subtotal;
}

updateTotal();
</script>
{% endblock %}
